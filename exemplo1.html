<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Formulário - Exemplo 1</title>
</head>
<body>
    <header style="background-color: #A4D3EE;">
        <br>
        <h1 style="text-align: center;">Formulário de Cadastro</h1>
        <br>
        <hr>
    </header>
    <!-- Contéudo principal -->
     <main>
        <!-- Criação do Formulario -->
         <!-- Action com # mantem o formulário na mesma pagina -->
          <!-- Method="get" faz o envio pela URL da pagina -->
         <form action="#" method="GET"></form>
         <!-- Primeiro campo -->
         <label for="nome">Nome </label>
            <input type="text" name="nome" id="nome" placeholder="Digite seu nome"required>
            <br>
            <hr>
            <!-- Segundo campo -->
            <label for="Idade">Idade</label>
            <input type="number" name="idade" id="idade" placeholder="Digite sua idade" required>
            <br>
            <hr>
            <!-- botão para o envio do formulário -->
            <button type="submit">ENVIAR</button>             
     </main>
</body>
</html>
