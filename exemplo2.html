<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport">
    <title>Document</title>
</head>
<body>
    <header style="background-color: mediumslateblue;">
        <br>
        <h1 style="text-align: center;"> Cadastro de Alunos</h1>
        <br>
        <hr>
    </header>
    <main>
        <!-- Formulário de cadastro -->
         <form action="#" method="get">
            <!-- nome do Aluno  -->
            <hr>
            <label for="nome">Nome do Aluno</label>
            <input type="text" name="nome" id="nome" placeholder="Digite o nome do aluno" required>
            <br>
            <hr>
            <!-- email do Aluno -->
             <label for="email">email do Aluno</label>
             <input type="email" name="email" id="email" placeholder="Digite o email do aluno" required>
             <br>
             <hr>
             <!-- Campo de telefone -->
              <label for="telefone">Telefone do Aluno</label>
              <input type="tel" name="telefone" id="telefone" placeholder="Digite o telefone do aluno" required>
              <br>
              <hr>
              <label for="data">Data de Nascimento</label>
              <input type="date" name="data" id="data" required>
              <br>
              <hr>
              <!-- Campo de idade -->
              <label for="idade">Idade do Aluno</label>
              <input type="number" name="idade" id="idade" placeholder="Digite a idade do aluno" required>
              <br>
              <hr>
              <!-- Campo de escolha -->
              <label for="escolha">Você Estuda para as provas ?</label>
              <!-- radio buttons só pode ser selecionado uma vez -->
              <input type="radio" name="escolha" id="sim" value="sim" required>
              <label for="sim">Sim, eu estudo|</label>
              <input type="radio" name="escolha" id="nao" value="nao" required>
              <label for="nao">Não, eu não estudo|</label>
              <br>
              <hr>
              <!-- campo range -->
              <label for="progresso">o quanto você gosta das aulas do SENAI</label>
              <input type="range" name="progresso" id="progresso" min="0" max="100" required>
              <br>
              <hr>
              <!-- Cor favorita -->
              <label for="cor">Qual sua cor favorita?</label>
              <input type="color" name="cor" id="cor" required>
              <br>
              <hr>
              <!-- Campo de seleção -->
              <label for="sala">Selecione a sua sala</label>
              <select name="sala" id="sala" required>
                  <option value="" selected disabled>Escolha a sua sala</option>
                  <option value="vermelha">sala vermelha</option>
                  <option value="azul">sala azul</option>
                  <option value="verde">sala verde</option>
              </select>
              <br>
              <hr>
              <!-- Campo de arquivo -->
              <label for="file">Envie seu arquivo</label>
              <input type="file" name="file" id="file" required>
              <br>
              <hr>
              <!-- campo com textarea -->
              <label for="Observacoes">Observações</label>
              <textarea name="Observacoes" id="Observacoes" rows="4" placeholder="Digite sua mensagem"></textarea>
              <br>
              <hr>
              <!-- campo do checkbox -->
              <input type="checkbox" name="termos" id="termos"  value="termos">
              <label for="termos">li e concordo com os termos e condições</label>
               <br>
              <input type="checkbox" name="receberEmail" id="receberEmail" value="receberEmail">
              <label for="receberEmail">Desejo receber emails sobre novidades</label>
              <br>
              <input type="checkbox" name="receberSMS" id="receberSMS" value="receberSMS">
              <label for="receberSMS">Desejo receber sms de divulgação</label>
              <br>
              <hr>
              
              <!-- botão de Envio -->
              <button type="submit">ENVIAR</button>
         </form>
    </main>
</body>
</html>
